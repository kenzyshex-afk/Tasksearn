      background: #f5f7fb;

      background: #6c4df6;

      padding: 25px;

      text-align: center;

    .task {

    .task h3 {
      margin-bottom: 8px;
    }

      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #6c4df6;
      color: white;
      font-size: 16px;
    }

    .task button:active {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      margin: 30px 0;
      color: #777;
    }
  </style>
</head>
